<div class="card h-100 shadow-sm border-0 series-card position-relative">
  {% if series.primary_series_image_url or series.first_product_image_url %}
    <img
      src="{{ media_url(series.primary_series_image_url or series.first_product_image_url) }}"
      class="card-img-top series-card-image"
      alt="{{ series.name }}"
    >
  {% endif %}

  <div class="card-body d-flex flex-column gap-2">
    <h3 class="h5 mb-0">
      <a class="stretched-link text-decoration-none" href="{{ series_url(series) }}">
        {{ series.name }}
      </a>
    </h3>

    <p class="small text-muted mb-0">
      {{ series.product_count }} products
    </p>
  </div>
</div>
